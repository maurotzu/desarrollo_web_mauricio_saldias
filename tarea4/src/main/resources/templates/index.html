<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Actividades</title>
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <h1 class="titulo">¡Bienvenidos!</h1>
        <h1 class="subtitulo">Actividades a evaluar</h1>   
        <table class="tabla-resumen">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Fecha Inicio</th>
                        <th>Sector</th>
                        <th>Nombre</th>
                        <th>Tema</th>
                        <th>Nota</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="actividadesTable">
                </tbody>
        </table>
    </div>

    <div class="modal fade" id="evaluacionModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <h5 class="modal-title">Evaluar Actividad</h5>
                <p id="actividadNombre"></p>
                <div class="mb-3">
                    <label for="notaInput" class="form-label">Seleccione una nota (1-7):</label>
                    <select class="form-select" id="notaInput">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                    </select>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="confirmarEvaluacion">Evaluar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/evaluacion.js}"></script>
</body>
</html>
